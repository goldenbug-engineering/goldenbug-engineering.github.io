<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="apple-touch-icon" href="/logo.png">
<title>Golden Bug</title>
<style>
:root { --ink:#1d2a14; --paper:#fbfaf5; --accent:#2f7d32; --muted:#5d6b55; --rule:#dde3d6; }
@media (prefers-color-scheme: dark) { :root { --ink:#e6ebdf; --paper:#15190f; --accent:#8bd07f; --muted:#aab59f; --rule:#2d3626; } }
html { background: var(--paper); }
body { margin: 0; color: var(--ink); font: 17px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--paper); }
main { max-width: 44rem; margin: 0 auto; padding: 2rem 16px 4rem; }
h1 { font-size: 2rem; margin: 0 0 .2em; }
h2 { font-size: 1.3rem; margin: 2em 0 .5em; padding-top: .4em; border-top: 2px solid var(--rule); }
.meta { color: var(--muted); margin: 0 0 2em; }
a { color: var(--accent); }
table { border-collapse: collapse; width: 100%; margin: .5em 0 1em; }
th, td { text-align: left; vertical-align: top; padding: .45em .6em; border-bottom: 1px solid var(--rule); }
th { font-size: .9rem; color: var(--muted); font-weight: 600; }
.brand { display: flex; align-items: center; gap: .5em; }
.brand img { image-rendering: pixelated; flex: none; }
</style>
</head>
<body>
<main>
<h1 class="brand"><img src="logo.png" alt="" width="56" height="56">Golden Bug</h1>
<p class="meta">Small games, made with care.</p>

<h2>Ribbit Rush</h2>
<p>Tilt your phone and bounce a frog up an endless climb. Shoot the snakes, grab the cattails, earn the hats.</p>
<ul>
<li><a href="ribbit-rush/support/">Support</a></li>
<li><a href="ribbit-rush/privacy/">Privacy policy</a></li>
</ul>

<h2>Contact</h2>
<p><a href="mailto:goldenbug.engineering@gmail.com">goldenbug.engineering@gmail.com</a></p>
</main>
</body>
</html>
